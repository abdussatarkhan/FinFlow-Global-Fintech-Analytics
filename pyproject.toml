[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow_global_fintech_analytics"
version = "1.0.0"
description = "Enterprise FinTech & Neo-Banking Cross-Border Payment Analytics Platform with Star Schema Data Warehouse, Power BI Semantic Model & Interactive Dashboard."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
